[package]
name = "kandela-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
log = "0.4.34"
mdns-sd = "0.21.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
